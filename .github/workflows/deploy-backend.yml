name: Deploy WordPress backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - composer.json
      - composer.lock
      - app/public/wp-content/plugins/pf2026-content/**
      - scripts/deploy-backend.sh
      - scripts/tests/deploy-backend.test.mjs
      - .github/workflows/deploy-backend.yml

permissions:
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate deployment script
        shell: bash
        run: |
          bash -n scripts/deploy-backend.sh
          node --test scripts/tests/deploy-backend.test.mjs

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Invalid LIGHTSAIL_HOST"; exit 1; }
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || { echo "SSH secrets are missing"; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/lightsail"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'CONFIG'
          Host lightsail-deploy
            User admin
            IdentityFile ~/.ssh/lightsail
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
          CONFIG
          printf '  HostName %s\n' "$HOST" >> "$HOME/.ssh/config"

      - name: Upload backend release
        shell: bash
        run: |
          set -euo pipefail
          incoming="/var/www/portfolio/incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh lightsail-deploy "umask 077; mkdir -p '$incoming'"
          tar -czf - composer.json composer.lock scripts/deploy-backend.sh \
            app/public/wp-content/plugins/pf2026-content |
            ssh lightsail-deploy "tar -xzf - -C '$incoming'"

      - name: Install and deploy backend
        shell: bash
        run: |
          set -euo pipefail
          incoming="/var/www/portfolio/incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh lightsail-deploy "bash '$incoming/scripts/deploy-backend.sh' '$incoming'"

      - name: Remove runner SSH credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/lightsail" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
