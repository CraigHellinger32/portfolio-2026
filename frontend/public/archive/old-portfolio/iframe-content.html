<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Import Project</title>
      <link href="css/perfect-scrollbar.css" rel="stylesheet">
      <style>
        .contentHolder { position:relative; margin:0px auto; padding:0px; width: 266px; height: 436px; overflow: hidden; }
        .contentHolder .content { width: 266px; height: 436px; }
        .spacer { text-align:center }
        body { padding: 0; margin: 0; background: url('img/loader.png') center no-repeat;}
        iframe {
          overflow:hidden;
          border: none;
        }
      </style>
      <script type="text/javascript">
          function getQueryVariable(variable)
          {
                 var query = window.location.search.substring(1);
                 var vars = query.split("&");
                 for (var i=0;i<vars.length;i++) {
                         var pair = vars[i].split("=");
                         if(pair[0] == variable){return pair[1];}
                 }
                 return(false);
          }
  
          var src = getQueryVariable('src');
  
          if (getQueryVariable('h') != false) {
            var height_var = getQueryVariable('h');
          } else {
            var height_var = 436;
          }
      </script>
  </head>
  <body>
    <div id="Default" class="contentHolder">
      <div class="content">
        <script type="text/javascript">
          if (src != false) {
            document.write('<iframe width="266" height="' + height_var + '" src="' + src + '"></iframe>');
          }
        </script>
      </div>
    </div>
  </body>
</html>
